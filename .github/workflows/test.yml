name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: make manifest
      - name: Unit tests
        run: ./tests/run.sh

  integration:
    # A real install, in a throwaway container, on every supported release.
    # This is the only way to catch "works on my laptop" drift in apt repos.
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04']
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y sudo curl git jq python3 python3-pip ca-certificates
          useradd -m -s /bin/bash runner
          echo 'runner ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/runner
      - uses: actions/checkout@v4
      - name: Dry-run install as an unprivileged user
        run: |
          chown -R runner:runner .
          su runner -c 'pip install pyyaml --break-system-packages -q || true'
          su runner -c 'python3 scripts/compile-manifest.py'
          su runner -c './bin/aistack install minimal --dry-run --yes'
          su runner -c './bin/aistack list'
          su runner -c './bin/aistack why superpowers'
